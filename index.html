        <meta name="twitter:card" content="summary" />
        <script>
            // Apply the saved or OS theme before paint, so there is no flash.
            (function () {
                try {
                    var t = localStorage.getItem("resu_theme");
                    if (t !== "light" && t !== "dark") {
                        t = window.matchMedia("(prefers-color-scheme: dark)").matches
                            ? "dark"
                            : "light";
                    }
                    document.documentElement.dataset.theme = t;
                } catch (e) {}
            })();
        </script>
    </head>

        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
