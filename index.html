<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Resu — choose your risk on any asset</title>
        <meta
            name="description"
            content="Risk-graded yield, built for tokenized real-world assets — and ETH, staking tokens and more. Deposit once and pick a tier: protected and steady, or aggressive and high-upside. Live on 7 chains."
        />

        <meta property="og:title" content="Resu — choose your risk on any asset" />
        <meta
            property="og:description"
            content="Risk-graded yield for tokenized stocks, ETH and staking assets. Pick a tier: protected and steady, or aggressive and high-upside."
        />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary" />
        <script>
            // Apply the saved or OS theme before paint, so there is no flash.
            (function () {
                try {
                    var t = localStorage.getItem("resu_theme");
                    if (t !== "light" && t !== "dark") {
                        t = window.matchMedia("(prefers-color-scheme: dark)").matches
                            ? "dark"
                            : "light";
                    }
                    document.documentElement.dataset.theme = t;
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
