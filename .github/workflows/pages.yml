name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual run from the Actions tab without a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish runs at a time. We don't cancel unfinished ones:
# an aborted Pages deploy leaves the site in an intermediate state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same checks as locally: types, building the contract messages,
      # running the app in a browser-like environment. Publishing something broken
      # is worse than not publishing at all.
      - run: npm run typecheck
      - run: npm run selftest
      - run: npm run smoke

      # The manifest is the only thing the wallet downloads itself, and the only thing
      # invisible until a connection attempt. We check it before publishing.
      # There are many variables, and a missing one doesn't break the build — the app just
      # silently falls back. That's exactly how we lost the
      # TonConnect manifest and got "invalid manifest" on the live site.
      - run: npm run check-env

      - name: Check TonConnect manifest
        env:
          VITE_TONCONNECT_MANIFEST_URL: ${{ secrets.VITE_TONCONNECT_MANIFEST_URL }}
          PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: npm run check-manifest

      - name: Build
        env:
          # Pages serves the site at /<repo>/, not from the domain root.
          BASE_PATH: /${{ github.event.repository.name }}/

          # All VITE_* variables must be here: the build sees only what
          # is passed to it explicitly. A missing variable isn't a build error —
          # the app just silently falls back.
          # --- TON ---
          VITE_NETWORK: ${{ secrets.VITE_NETWORK || 'mainnet' }}
          VITE_TONCONNECT_MANIFEST_URL: ${{ secrets.VITE_TONCONNECT_MANIFEST_URL }}
          VITE_TON_ENDPOINT: ${{ secrets.VITE_TON_ENDPOINT }}
          # The toncenter key removes the request limit. In a static build it
          # ends up in the public bundle — see the README, the Pages section.
          VITE_TONCENTER_API_KEY: ${{ secrets.VITE_TONCENTER_API_KEY }}

          # --- Solana ---
          VITE_SOLANA_NETWORK: ${{ secrets.VITE_SOLANA_NETWORK || 'devnet' }}
          VITE_SOLANA_RPC: ${{ secrets.VITE_SOLANA_RPC }}
          VITE_HYPEREVM_RPC: ${{ secrets.VITE_HYPEREVM_RPC }}
          # Without it WalletConnect won't work at all.
          # Public by design: it ends up in the bundle and is visible to all.
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
